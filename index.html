nav{margin-left:auto;display:flex;gap:4px;align-items:center}
button,.btn{font:inherit;font-weight:500;height:38px;padding:0 14px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,border-color .15s}
button:hover,.btn:hover{background:var(--sub)}
button:focus-visible,.btn:focus-within{outline:none;box-shadow:0 0 0 3px var(--ring)}
button.pri{background:var(--or);border-color:var(--or);color:#0a0a0a;font-weight:600}
button.pri:hover{background:var(--or);filter:brightness(1.08)}
button.dng{color:#f87171;border-color:#f8717144}
button:disabled{opacity:.6;cursor:default}
nav button{height:32px;padding:0 9px;font-size:13px;white-space:nowrap}
.logo{height:20px!important;width:117px!important}
input[type=number]{-moz-appearance:textfield;appearance:textfield}input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
nav button:not(.pri){border-color:transparent;color:var(--mut)}
nav button.on:not(.pri){background:var(--sub);color:var(--ink)}
main{max-width:720px;margin:0 auto;padding:14px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em}.stat span{color:var(--mut);font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chips button{white-space:nowrap;height:30px;padding:0 12px;font-size:13px;border-radius:999px;color:var(--mut)}
.chips button.on{background:var(--or);border-color:var(--or);color:#0a0a0a;font-weight:600}
input,select{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0;height:38px}
input:focus,select:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 3px var(--ring)}
select option{background:#111;color:#fafafa}
.search{margin-bottom:10px;background:var(--card)}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.item:hover{border-color:#525252}
.item .dt{min-width:46px;text-align:center;background:var(--sub);border:1px solid var(--line);color:var(--or);border-radius:10px;padding:4px 0;font-weight:700;line-height:1.15}
.item .dt small{display:block;font-weight:500;font-size:11px;color:var(--mut);text-transform:uppercase}
.item .mid{flex:1;min-width:0}.item .mid b,.item .mid span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mid b{font-weight:600}.item .mid span{color:var(--mut);font-size:13px}
.item .sum{text-align:right;flex:none;white-space:nowrap}.item .sum small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.item .sum .rest{display:block;font-size:18px;font-weight:800;color:var(--or)}
.tag{font-size:11px;background:var(--sub);border:1px solid var(--line);color:var(--mut);border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:500}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.sheet h3{margin:0 0 12px;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--mut)}
.row{display:grid;grid-template-columns:42% 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:6px}
.row>div{padding:4px 10px;display:flex;align-items:center;min-height:40px}
.row>div:first-child{background:var(--sub);color:var(--mut);font-weight:500;font-size:13px}
.row input,.row select{border:0;background:transparent;height:34px;padding:0 4px;box-shadow:none}
.row input:focus,.row select:focus{box-shadow:none;outline:1px solid var(--or);outline-offset:-1px;border-radius:4px}
.ct{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ct .h,.ct .l{display:grid;grid-template-columns:minmax(0,1fr) 40px 100px 60px;align-items:center}
.ct.b .h,.ct.b .l{grid-template-columns:minmax(0,1fr) 78px 100px 60px}
.ct .h{font-weight:600;font-size:11px;letter-spacing:.06em;background:var(--sub);color:var(--mut)}
.ct .h>div,.ct .l>div{padding:6px 4px}
.ct .l>div:first-child,.ct .h>div:first-child{padding-left:10px}
.ct .l{border-top:1px solid var(--line)}
.ct .l>div:nth-child(2),.ct .l>div:nth-child(3){text-align:right}
.ct .l>div:last-child{text-align:right;padding-right:8px}
.qty{display:flex;align-items:center;gap:2px;width:100%;background:transparent;border:1px solid var(--line);border-radius:8px}
.qty button{padding:0;width:28px;height:30px;border:0;background:transparent;color:var(--or);font-size:17px;border-radius:6px}
.qty input{flex:1;width:0;min-width:0;text-align:center;padding:4px 0;border:0;background:transparent;height:30px;box-shadow:none}
.tot{display:flex;justify-content:space-between;font-weight:600;padding:8px 10px;border-top:1px solid var(--line);background:var(--sub)}
.tot span:last-child{color:var(--or)}
.big{font-size:16px;font-weight:600}
.huge{font-size:26px;font-weight:800;line-height:1.1}
.row.rest>div{background:var(--or)!important;color:#0a0a0a!important;min-height:52px}.row.rest>div:first-child{font-size:15px;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.actions .sp{flex:1}
.priceinp{width:100%;text-align:right;padding:4px 6px;height:32px}
.note{color:var(--mut);font-size:12px;margin:8px 2px}
.empty{text-align:center;color:var(--mut);padding:30px}
.pt{width:100%;border-collapse:collapse;text-align:center;border:1px solid var(--line);border-radius:8px}
.pt td,.pt th{border:1px solid var(--line);padding:10px 8px;vertical-align:top}
.pt th{background:var(--sub);font-size:14px}.pt td:first-child,.pt th:first-child{font-weight:600;background:var(--sub);color:var(--mut);font-size:13px}
.pt small{display:block;font-weight:400;color:var(--mut)}.pt .red{color:var(--or);font-size:12px;display:block;margin-top:4px;font-weight:600}
.pt .pr{font-size:18px;color:var(--or);font-weight:700}
.pl{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.pl:last-child{border-bottom:0}.pl b{font-weight:600}
.fl{margin-bottom:14px}.flh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.flb{height:32px;padding:0 10px;font-size:13px}
.fls{display:flex;flex-wrap:wrap;gap:8px}.th{position:relative;width:84px;height:84px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000}

  <input class="search" id="q" placeholder="Caută după nume sau sărbătorit…" value="${esc(qs)}">
  ${L.map(f=>{const p=dparts(f.d);return `<div class="item" data-id="${f.id}"><div class="dt">${p.day??"?"}<small>${MON[p.m-1]||""}</small></div><div class="mid"><b>${esc(f.n)||"(fără nume)"}${f.t==="LV"?'<span class="tag" style="display:inline">L-V</span>':""}</b><span>${f.s?esc(f.s)+" · ":""}${f.p} part. · ${esc(f.i)||"interval necompletat"}</span></div><div class="sum"><span class="rest">${fmt(rest(f))}</span><small>rest · din ${fmt(total(f))}</small></div></div>`}).join("")||'<div class="empty">Nicio fișă găsită.</div>'}
  ${dbErr?`<div class="sheet"><b style="color:var(--or)">Nu pot accesa baza de date.</b><p class="note">${esc(dbErr)}<br>Verifică regulile Firestore pentru colecția „fise".</p></div>`:!loaded?'<p class="note">Se încarcă…</p>':""}
  ${loaded&&!S.length&&!dbErr?'<div class="sheet"><p>Baza de date e goală.</p><button class="pri" id="imp">Importă istoricul 2026 ('+SEED.length+' fișe)</button></div>':""}
  <div class="sheet"><h3>CULOARE ACCENT</h3><div class="sw">${ACC.map(c=>`<button data-acc="${c}" style="background:${c}" class="${c===curAcc?"on":""}" aria-label="${c}"></button>`).join("")}</div><p class="note">Se salvează pe acest dispozitiv.</p></div>
  <div class="actions"><button id="exp">Export backup</button><label class="btn">Importă istoric din fișier<input type="file" id="impo" accept=".json" hidden></label></div>
  <p class="note">Datele sunt salvate online și se văd la toți, în timp real.</p>`;
  document.querySelectorAll(".chips button[data-y]").forEach(b=>b.onclick=()=>{yr=+b.dataset.y;flt="all";hist()});
  document.querySelectorAll(".chips button[data-m]").forEach(b=>b.onclick=()=>{flt=b.dataset.m;hist()});
  $("#q").oninput=e=>{qs=e.target.value;const p=e.target.selectionStart;hist();const q=$("#q");q.focus();q.setSelectionRange(p,p)};
  document.querySelectorAll(".item").forEach(i=>i.onclick=()=>{cur=JSON.parse(JSON.stringify(S.find(f=>f.id===i.dataset.id)));isNew=false;view="form";render();scrollTo(0,0)});
  $("#exp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="fise-party-backup.json";a.click()};
  if($("#imp"))$("#imp").onclick=importSeed;
  $("#impo").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)importOld(f)};
  document.querySelectorAll("[data-acc]").forEach(b=>b.onclick=()=>{curAcc=b.dataset.acc;document.documentElement.style.setProperty("--or",curAcc);try{localStorage.setItem("fise-acc",curAcc)}catch(e){};hist()});
}
function form(){
  const f=cur;if(!f.x[0])f.x[0]=SV[0][1];if(!f.x[2])f.x[2]=SV[1][1];
  $("#app").innerHTML=`<div class="sheet"><h3>${isNew?"FIȘĂ NOUĂ":"FIȘĂ PARTY"}</h3>
  <div class="row p"><div>DATA</div><div><input type="date" data-k="d" value="${/^\d{4}-\d{2}-\d{2}$/.test(f.d)?f.d:""}"></div></div>
  <div class="row p"><div>INTERVAL</div><div><input list="ints" data-k="i" value="${esc(f.i)}" placeholder="ex. 16:00-19:00"><datalist id="ints">${INTS.map(i=>`<option value="${i}">`).join("")}</datalist></div></div>
  <div class="row p"><div>NUME</div><div><input data-k="n" value="${esc(f.n)}"></div></div>
  <div class="row p"><div>NUME SĂRBĂTORIT</div><div><input data-k="s" value="${esc(f.s)}"></div></div>
  <div class="row g"><div>NR. PARTICIPANȚI PLĂTITORI</div><div><input type="number" min="0" data-k="p" value="${f.p}"></div></div>
  <div class="row g"><div>TIP PETRECERE</div><div><select data-k="t"><option value="VS" ${f.t==="VS"?"selected":""}>Vineri Seara &amp; WK</option><option value="LV" ${f.t==="LV"?"selected":""}>L-V</option></select></div></div>
  <div class="row g"><div>PREȚ ÎNCHIRIERE</div><div><input type="number" data-k="r" value="${rent(f)}"></div></div>
  <div class="row g"><div>PREȚ/PARTICIPANT</div><div><input type="number" data-k="pp" value="${f.pp}"></div></div>
  <p class="note">Închirierea și prețul/participant se completează automat din tip și număr (vezi Prețuri), dar le poți modifica.</p></div>
  <div class="sheet"><div class="ct p"><div class="h"><div>CONSUMAȚIE</div><div>PREȚ</div><div>BUCĂȚI</div><div style="text-align:right">TOTAL</div></div>
  ${DR.map((x,i)=>(x[2]&&!(f.q[i]>0))?"":`<div class="l"><div>${x[0]}</div><div>${dp(f,i)}</div><div><div class="qty"><button data-q="${i}" data-s="-1">−</button><input type="number" min="0" data-qi="${i}" value="${f.q[i]||0}"><button data-q="${i}" data-s="1">+</button></div></div><div id="dt${i}">${dp(f,i)*(f.q[i]||0)}</div></div>`).join("")}
  <div class="tot"><span>TOTAL</span><span id="td"></span></div></div></div>
  <div class="sheet"><div class="ct b"><div class="h"><div>SERVICII EXTRA</div><div>PREȚ</div><div>BUCĂȚI</div><div style="text-align:right">TOTAL</div></div>
  ${["FOTOGRAF","BALOANE HELIU"].map((n,j)=>`<div class="l"><div>${n}</div><div><input class="priceinp" type="number" min="0" data-x="${2*j}" value="${f.x[2*j]||0}"></div><div><div class="qty"><button data-xq="${2*j+1}" data-s="-1">−</button><input type="number" min="0" data-x="${2*j+1}" value="${f.x[2*j+1]||0}"><button data-xq="${2*j+1}" data-s="1">+</button></div></div><div id="xt${j}"></div></div>`).join("")}
  <div class="tot"><span>TOTAL</span><span id="te"></span></div></div></div>
  <div class="sheet"><div class="row gr"><div class="big">TOTAL GENERAL</div><div class="big" id="tg" style="justify-content:flex-end;font-weight:700"></div></div>
  <div class="row gr"><div>din care avans achitat</div><div><input type="number" min="0" data-k="a" value="${f.a}"></div></div>
  <div class="row gr rest"><div class="huge">REST DE PLATĂ</div><div class="huge" id="tr" style="justify-content:flex-end"></div></div></div>
  ${filesHTML()}
  <div class="actions"><button class="pri" id="sv">Salvează</button><button id="dp">Duplică</button><button onclick="window.print()">Printează</button><span class="sp"></span>${isNew?"":'<button class="dng" id="dl">Șterge</button>'}<button id="bk">Înapoi</button></div>`;
  const upd=()=>{DR.forEach((x,i)=>{const el=$("#dt"+i);if(el)el.textContent=dp(cur,i)*(+cur.q[i]||0)});
    [0,1].forEach(j=>$("#xt"+j).textContent=(+cur.x[2*j]||0)*(+cur.x[2*j+1]||0));
    $("#td").textContent=fmt(drinksTot(cur));$("#te").textContent=fmt(extraTot(cur));$("#tg").textContent=fmt(total(cur));$("#tr").textContent=fmt(rest(cur))};
  upd();
  document.querySelectorAll("[data-k]").forEach(e=>e.oninput=()=>{const k=e.dataset.k;
    if(k==="r"){cur.r=+e.value}else if(["p","pp","a"].includes(k)){cur[k]=+e.value}else cur[k]=e.value;
    if(k==="t"){delete cur.r;cur.pp=ppAuto(cur);form();return}
    if(k==="p"){cur.pp=ppAuto(cur);document.querySelector('[data-k="pp"]').value=cur.pp}upd()});
  document.querySelectorAll("[data-qi]").forEach(e=>e.oninput=()=>{cur.q[e.dataset.qi]=Math.max(0,+e.value||0);upd()});
  document.querySelectorAll("[data-x]").forEach(e=>e.oninput=()=>{cur.x[e.dataset.x]=+e.value;upd()});
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{const i=b.dataset.q;cur.q[i]=Math.max(0,(+cur.q[i]||0)+ +b.dataset.s);b.parentNode.querySelector("input").value=cur.q[i];upd()});
  document.querySelectorAll("[data-xq]").forEach(b=>b.onclick=()=>{const i=b.dataset.xq;cur.x[i]=Math.max(0,(+cur.x[i]||0)+ +b.dataset.s);b.parentNode.querySelector("input").value=cur.x[i];upd()});
  $("#sv").onclick=async()=>{const b=$("#sv");b.disabled=true;b.textContent="Se salvează…";try{await setDoc(doc(db,"fise",cur.id),JSON.parse(JSON.stringify(cur)));isNew=false;view="hist";render()}catch(e){alert("Nu s-a salvat: "+e.message);b.disabled=false;b.textContent="Salvează"}};
  $("#dp").onclick=()=>{cur=JSON.parse(JSON.stringify(cur));cur.id=doc(fise).id;cur.n="";cur.s="";cur.a=500;isNew=true;form();scrollTo(0,0)};
  $("#bk").onclick=()=>{if(isNew)curFiles.forEach(f=>deleteDoc(doc(db,"fise_files",f.id)));view="hist";render()};
  if($("#dl"))$("#dl").onclick=()=>{if(confirm("Ștergi această fișă?")){deleteDoc(doc(db,"fise",cur.id));curFiles.forEach(f=>deleteDoc(doc(db,"fise_files",f.id)));view="hist";render()}};
  initFiles();
}
const FL=[["bon","Bon comandă mâncare"],["cert","Certificat de conformitate"]];
function filesHTML(){return `<div class="sheet"><h3>DOCUMENTE</h3>${FL.map(([k,t])=>`<div class="fl"><div class="flh"><b>${t}</b><label class="btn flb">+ Poză / fișier<input type="file" accept="image/*,application/pdf" multiple hidden data-ff="${k}"></label></div><div class="fls" id="fl-${k}"></div></div>`).join("")}<p class="note">Poze (se micșorează automat) și PDF-uri de maxim ~650 KB.</p></div>`}
function renderFiles(){FL.forEach(([k])=>{const b=$("#fl-"+k);if(!b)return;const L=curFiles.filter(f=>f.field===k).sort((a,c)=>a.at-c.at);
 b.innerHTML=L.length?L.map(f=>f.type.startsWith("image/")?`<div class="th"><img src="${f.data}" data-open="${f.id}" alt=""><button class="x" data-fd="${f.id}">✕</button></div>`:`<div class="th pdf"><a href="${f.data}" download="${esc(f.name)}">PDF<small>${esc(f.name)}</small></a><button class="x" data-fd="${f.id}">✕</button></div>`).join(""):'<span class="note">Nimic adăugat încă.</span>'})}
function initFiles(){
 if(filesFor!==cur.id){unsubF&&unsubF();filesFor=cur.id;curFiles=[];
  unsubF=onSnapshot(query(filesCol,where("fisaId","==",cur.id)),snap=>{curFiles=snap.docs.map(d=>({...d.data(),id:d.id}));renderFiles()},e=>{const b=$("#fl-bon");if(b)b.textContent="Nu pot accesa documentele: "+e.message})}
 renderFiles();
 document.querySelectorAll("[data-ff]").forEach(inp=>inp.onchange=async()=>{const k=inp.dataset.ff,box=$("#fl-"+k),files=[...inp.files];inp.value="";
  for(const f of files){box.insertAdjacentHTML("beforeend",'<span class="note ld">Se încarcă…</span>');
   try{const data=await toData(f);await setDoc(doc(filesCol),{fisaId:cur.id,field:k,name:f.name,type:data.slice(5,data.indexOf(";")),data,at:Date.now()})}catch(e){alert(f.name+": "+e.message)}
   box.querySelectorAll(".ld").forEach(x=>x.remove())}});
 document.querySelectorAll(".fls").forEach(b=>b.onclick=e=>{const d=e.target.dataset;if(d.fd){if(confirm("Ștergi fișierul?"))deleteDoc(doc(db,"fise_files",d.fd))}else if(d.open)lightbox(curFiles.find(f=>f.id===d.open))})}
function toData(f){return new Promise((res,rej)=>{
 if(f.type.startsWith("image/")){const img=new Image(),u=URL.createObjectURL(f);img.onload=()=>{const w=img.width,h=img.height;let s=Math.min(1,1600/Math.max(w,h)),q=.72,out="";
  for(let t=0;t<5;t++){const c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);out=c.toDataURL("image/jpeg",q);if(out.length<900000)break;s*=.8;q-=.08}
  URL.revokeObjectURL(u);out.length<950000?res(out):rej(new Error("poza e prea mare"))};img.onerror=()=>rej(new Error("imagine invalidă"));img.src=u}
 else if(f.type==="application/pdf"){if(f.size>650000)return rej(new Error("PDF prea mare (max ~650 KB). Fă o poză în loc."));const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error("nu pot citi fișierul"));r.readAsDataURL(f)}
 else rej(new Error("doar poze sau PDF"))})}
function lightbox(f){if(!f)return;const d=document.createElement("div");d.className="lb";d.innerHTML=`<img src="${f.data}" alt=""><a class="btn" href="${f.data}" download="${esc(f.name)}">Descarcă</a>`;d.onclick=e=>{if(e.target.tagName!=="A")d.remove()};document.body.appendChild(d)}
render();
window.__fise_ok=true;
</script>
